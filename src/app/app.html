<div class="flex h-screen overflow-hidden">
  <div class="relative min-w-0 flex-1">
    <app-renderer />
    <div class="absolute left-4 top-4 z-10 flex gap-2">
      <button type="button" title="Undo (Ctrl+Z)" [disabled]="!state.canUndo()" (click)="state.undo()"
        class="rounded-lg border border-slate-300 bg-white/90 px-3 py-2 text-xs font-bold text-slate-700 shadow disabled:cursor-not-allowed disabled:opacity-40">↶</button>
      <button type="button" title="Redo (Ctrl+Y)" [disabled]="!state.canRedo()" (click)="state.redo()"
        class="rounded-lg border border-slate-300 bg-white/90 px-3 py-2 text-xs font-bold text-slate-700 shadow disabled:cursor-not-allowed disabled:opacity-40">↷</button>
    </div>
  </div>

  <aside
    class="ui-sidebar relative z-10 w-80 overflow-hidden border-l border-slate-200 bg-slate-50 p-4"
  >
    <app-sidebar />
  </aside>
</div>
